version: 2
updates:
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 1,15 * *"
      timezone: "Etc/UTC"
    # Open one pull request for all the nix inputs together.
    groups:
      nix-inputs:
        patterns:
          - "*"
  # The workflows pin actions by full SHA; without this, those pins never get
  # update PRs and silently rot. Scans .github/workflows/.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/setup-nix"
    schedule:
      interval: "cron"
      cronjob: "0 9 1,15 * *"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 3
    # Open one pull request for all the action updates together, across the
    # two directories.
    groups:
      actions:
        patterns:
          - "*"
