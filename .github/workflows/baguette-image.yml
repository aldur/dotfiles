# Builds a ChromeOS Baguette image and keeps it as a workflow artifact.
on:
  workflow_dispatch:
    inputs:
      image:
        description: The flake under base_hosts that builds the image
        type: choice
        options:
          - autofirma
          - crostini
        default: autofirma
      retention-days:
        description: Days to keep the artifact
        type: number
        default: 7

permissions:
  contents: read

env:
  # See ci.yml. These are just cached SSH public keys pulled from the API.
  SIGNING_KEYS: /tmp/ssh_signing_keys.json

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write # necessary to sign the attestations with Sigstore
      attestations: write # necessary to store the attestations on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix

      - name: Reclaim disk space
        run: .github/scripts/reclaim-disk.sh

      - env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/fetch-signing-keys.sh

      - run: |
          nix build --override-input aldur-dotfiles . \
            --override-input aldur-dotfiles/gh-signing-keys "file+file://$SIGNING_KEYS" \
            "./base_hosts/${{ inputs.image }}#baguette-zimage"

      # The SBOM of the system in the image. The build above made the
      # system, so this only walks its closure. See utils/sbom.nix.
      - run: |
          nix run --override-input aldur-dotfiles . \
            --override-input aldur-dotfiles/gh-signing-keys "file+file://$SIGNING_KEYS" \
            "./base_hosts/${{ inputs.image }}#sbom-baguette" -- /tmp/sbom

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: result/*.zst
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: result/*.zst
          sbom-path: /tmp/sbom/sbom.spdx.json

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ inputs.image }}-baguette-arm64
          path: result/*.zst
          if-no-files-found: error
          # The artifact is always a zip. The image is zstd-compressed, so
          # deflate in the zip gains nothing. Level 0 stores it as it is.
          compression-level: 0
          retention-days: ${{ inputs.retention-days }}
