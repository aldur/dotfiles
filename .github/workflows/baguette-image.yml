# Builds the ChromeOS Baguette image of base_hosts/crostini and keeps it as
# a workflow artifact.
name: Build Baguette image

on:
  workflow_dispatch:
    inputs:
      retention-days:
        description: Days to keep the artifact
        type: number
        default: 7

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # See ci.yml. These are just cached SSH public keys pulled from the API.
  SIGNING_KEYS: /tmp/ssh_signing_keys.json

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04-arm
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix

      - uses: ./.github/actions/reclaim-disk
      - uses: ./.github/actions/fetch-signing-keys
        with:
          token: ${{ github.token }}
          path: ${{ env.SIGNING_KEYS }}

      - run: |
          nix build --override-input aldur-dotfiles . \
            --override-input aldur-dotfiles/gh-signing-keys "file+file://$SIGNING_KEYS" \
            "./base_hosts/crostini#baguette-zimage"

      # The SBOM of the system in the image. The build above made the
      # system, so this only walks its closure. See utils/sbom.nix.
      - run: |
          nix run --override-input aldur-dotfiles . \
            --override-input aldur-dotfiles/gh-signing-keys "file+file://$SIGNING_KEYS" \
            "./base_hosts/crostini#sbom-baguette" -- /tmp/subject

      # The attest job below attests the image by its checksum. The subject
      # name is the file name in the checksums file, so run the command in
      # the directory of the image.
      - run: (cd result && sha256sum -- *.zst) > /tmp/subject/checksums.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crostini-baguette-arm64
          path: result/*.zst
          if-no-files-found: error
          # The artifact is always a zip. The image is zstd-compressed, so
          # deflate in the zip gains nothing. Level 0 stores it as it is.
          compression-level: 0
          retention-days: ${{ inputs.retention-days }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crostini-baguette-arm64-subject
          path: |
            /tmp/subject/checksums.txt
            /tmp/subject/sbom.spdx.json
          if-no-files-found: error
          retention-days: 1

  # A separate job without Nix: see .github/actions/attest.
  attest:
    name: attest
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # necessary to sign the attestations with Sigstore
      attestations: write # necessary to store the attestations on GitHub
    steps:
      - *checkout
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crostini-baguette-arm64-subject
          path: subject
      - uses: ./.github/actions/attest
        with:
          subject-checksums: subject/checksums.txt
          sbom-path: subject/sbom.spdx.json
