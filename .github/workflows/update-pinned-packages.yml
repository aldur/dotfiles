name: Update pinned packages

# Bumps every package in this repo that pins a source, using nix-update.
#
# See the `updatePins` flake output.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: # allow manual runs from the Actions tab

permissions: {}

jobs:
  # Both matrices below are built from the same list, so they can't drift apart.
  discover:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      legs: ${{ steps.read.outputs.legs }}
      packages: ${{ steps.read.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8

      - name: Derive the matrix from the packages themselves
        id: read
        run: |
          legs=$(nix eval --json .#updatePins)
          {
            echo "legs=$legs"
            echo "packages=$(jq -c 'map(.package)' <<< "$legs")"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.legs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8

      - name: Bump ${{ matrix.package }} with nix-update
        # --test runs the package's `passthru.tests` when it has any, and is a
        # no-op otherwise, so a package gaining tests is covered without
        # touching this workflow.
        run: |
          nix run nixpkgs#nix-update -- \
            --flake \
            --test \
            ${{ matrix.nix-update-args }} \
            ${{ matrix.attr }}

      # `verify` is always set: utils/update-pin-legs.nix defaults it to
      # building whatever top-level package the pin hangs off.
      - name: Verify it builds
        run: ${{ matrix.verify }}

      - name: Capture changes
        id: diff
        run: |
          git diff > update.patch
          if [ -s update.patch ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the patch
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-${{ matrix.package }}
          path: update.patch

  # Only this job holds the write token, and only to open the PR. It runs on a
  # cheap Linux runner: applying a text patch needs no Nix or macOS. It runs
  # even if another matrix leg's build failed (!cancelled()), so one broken
  # package doesn't block the others' PRs; a leg whose build produced no patch
  # is skipped via the missing artifact.
  pull-request:
    needs: [discover, build]
    if: ${{ !cancelled() && needs.discover.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the patch
        id: patch
        continue-on-error: true # no artifact means no update for this package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: patch-${{ matrix.package }}

      - name: Apply the update
        if: steps.patch.outcome == 'success'
        run: |
          git apply update.patch
          rm update.patch

      - name: Open pull request
        if: steps.patch.outcome == 'success'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automated/update-${{ matrix.package }}
          title: "packages: bump ${{ matrix.package }}"
          commit-message: "packages: bump ${{ matrix.package }}"
          body: |
            Automated `${{ matrix.package }}` bump via `nix-update`.

            Updates the pinned version/rev and source hashes,
            verified to build on the runner before opening this PR.
          delete-branch: true
