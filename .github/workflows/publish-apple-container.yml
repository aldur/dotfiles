on:
  workflow_dispatch:
  push:
    branches:
      - master
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Publish the master branch to the production `latest` tags. Publish each
# other branch (for example, staging) to `<branch>-*` tags. Then a branch
# cannot overwrite the `latest` tags that `container run` users pull.
env:
  TAG_PREFIX: ${{ github.ref_name == 'master' && 'latest' || github.ref_name }}
  # See the same variable in ci.yml. Only the `push` jobs use the keys: they
  # build the image and its SBOM, and the build evaluates the system
  # configuration that reads the keys. The `manifest` job below only
  # connects tags that were pushed before, and does not use the keys.
  SIGNING_KEYS: /tmp/ssh_signing_keys.json

jobs:
  push:
    name: ${{ matrix.app.name }} (${{ matrix.arch.suffix }})
    permissions:
      contents: read
      packages: write # necessary to push the image and its attestations to ghcr.io
      id-token: write # necessary to sign the attestations with Sigstore
      attestations: write # necessary to store the attestations on GitHub
    strategy:
      matrix:
        arch:
          - { runner: ubuntu-24.04-arm, suffix: arm64 }
          - { runner: ubuntu-24.04, suffix: amd64 }
        # `image` is the `virtualisation.appleContainer.imageName` of the
        # configuration that `name` pushes. The attestation names its subject
        # with it.
        app:
          - { name: push, sbom: sbom, image: aldur-nixos, reclaim-disk: true }
          - { name: push-minimal, sbom: sbom-minimal, image: nixos, reclaim-disk: false }
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &setup-nix
        uses: ./.github/actions/setup-nix

      - if: matrix.app.reclaim-disk
        run: .github/scripts/reclaim-disk.sh

      - &ghcr-login
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/fetch-signing-keys.sh

      # The app writes the digest of the pushed manifest to the file. The
      # attestation steps below use it as the subject.
      - id: publish
        run: |
          nix run --override-input aldur-dotfiles . \
            --override-input aldur-dotfiles/gh-signing-keys "file+file://$SIGNING_KEYS" \
            ./base_hosts/apple-container#${{ matrix.app.name }} \
            -- ghcr.io/${{ github.repository_owner }} "$TAG_PREFIX-${{ matrix.arch.suffix }}" /tmp/digest
          echo "digest=$(cat /tmp/digest)" >> "$GITHUB_OUTPUT"

      # The SBOM of the system in the image. The system is already built,
      # so this only walks its closure. See utils/sbom.nix.
      - run: |
          nix run --override-input aldur-dotfiles . \
            --override-input aldur-dotfiles/gh-signing-keys "file+file://$SIGNING_KEYS" \
            ./base_hosts/apple-container#${{ matrix.app.sbom }} -- /tmp/sbom

      - &attest-provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.app.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.app.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: /tmp/sbom/sbom.spdx.json
          push-to-registry: true

  manifest:
    needs: push
    name: ${{ matrix.app.name }}
    permissions:
      contents: read
      packages: write # necessary to push the multi-arch manifest and its attestation to ghcr.io
      id-token: write # necessary to sign the attestation with Sigstore
      attestations: write # necessary to store the attestation on GitHub
    strategy:
      matrix:
        app:
          - { name: manifest, image: aldur-nixos }
          - { name: manifest-minimal, image: nixos }
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *setup-nix

      # Push the multi-arch manifest for the tag prefix of the branch
      # (`latest` on master). The app writes the digest of the index to the
      # file. A client that verifies `:latest` verifies this digest.
      - *ghcr-login
      - id: publish
        run: |
          nix run --override-input aldur-dotfiles . \
            ./base_hosts/apple-container#${{ matrix.app.name }} \
            -- ghcr.io/${{ github.repository_owner }} "$TAG_PREFIX" /tmp/digest
          echo "digest=$(cat /tmp/digest)" >> "$GITHUB_OUTPUT"
      - *attest-provenance
