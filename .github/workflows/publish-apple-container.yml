on:
  workflow_dispatch:
  push:
    branches:
      - master
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Publish the master branch to the production `latest` tags. Publish each
# other branch (for example, staging) to `<branch>-*` tags. Then a branch
# cannot overwrite the `latest` tags that `container run` users pull.
env:
  TAG_PREFIX: ${{ github.ref_name == 'master' && 'latest' || github.ref_name }}
  # See the same variable in ci.yml. Only the `push` jobs use the keys: they
  # build the image and its SBOM, and the build evaluates the system
  # configuration that reads the keys. The `manifest` job below only
  # connects tags that were pushed before, and does not use the keys.
  SIGNING_KEYS: /tmp/ssh_signing_keys.json

jobs:
  push:
    name: ${{ matrix.app.name }} (${{ matrix.arch.suffix }})
    permissions:
      contents: read
      packages: write # necessary to push the image to ghcr.io
    strategy:
      matrix:
        arch:
          - { runner: ubuntu-24.04-arm, suffix: arm64 }
          - { runner: ubuntu-24.04, suffix: amd64 }
        # `image` is the `virtualisation.appleContainer.imageName` of the
        # configuration that `name` pushes. The attestation names its subject
        # with it.
        app:
          - { name: push, sbom: sbom, image: aldur-nixos, reclaim-disk: true }
          - { name: push-minimal, sbom: sbom-minimal, image: nixos, reclaim-disk: false }
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &setup-nix
        uses: ./.github/actions/setup-nix

      - if: matrix.app.reclaim-disk
        run: .github/scripts/reclaim-disk.sh

      - &ghcr-login
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/fetch-signing-keys.sh

      # The app writes the digest of the pushed manifest to the file. The
      # attest job below uses it as the subject.
      - run: |
          mkdir -p /tmp/subject
          nix run --override-input aldur-dotfiles . \
            --override-input aldur-dotfiles/gh-signing-keys "file+file://$SIGNING_KEYS" \
            ./base_hosts/apple-container#${{ matrix.app.name }} \
            -- ghcr.io/${{ github.repository_owner }} "$TAG_PREFIX-${{ matrix.arch.suffix }}" /tmp/subject/digest

      # The SBOM of the system in the image. The system is already built,
      # so this only walks its closure. See utils/sbom.nix.
      - run: |
          nix run --override-input aldur-dotfiles . \
            --override-input aldur-dotfiles/gh-signing-keys "file+file://$SIGNING_KEYS" \
            ./base_hosts/apple-container#${{ matrix.app.sbom }} -- /tmp/subject

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: subject-${{ matrix.app.image }}-${{ matrix.arch.suffix }}
          path: |
            /tmp/subject/digest
            /tmp/subject/sbom.spdx.json
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: push
    name: ${{ matrix.app.name }}
    permissions:
      contents: read
      packages: write # necessary to push the multi-arch manifest to ghcr.io
    strategy:
      matrix:
        app:
          - { name: manifest, image: aldur-nixos }
          - { name: manifest-minimal, image: nixos }
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *setup-nix

      # Push the multi-arch manifest for the tag prefix of the branch
      # (`latest` on master). The app writes the digest of the index to the
      # file. A client that verifies `:latest` verifies this digest.
      - *ghcr-login
      - run: |
          mkdir -p /tmp/subject
          nix run --override-input aldur-dotfiles . \
            ./base_hosts/apple-container#${{ matrix.app.name }} \
            -- ghcr.io/${{ github.repository_owner }} "$TAG_PREFIX" /tmp/subject/digest

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: subject-${{ matrix.app.image }}-index
          path: /tmp/subject/digest
          if-no-files-found: error
          retention-days: 1

  # Attest the provenance and the SBOM of each pushed image, and the
  # provenance of each index. A separate job without Nix: see
  # .github/actions/attest.
  attest:
    needs: [push, manifest]
    name: attest ${{ matrix.image }} (${{ matrix.subject }})
    permissions:
      contents: read
      packages: write # necessary to push the attestations to ghcr.io
      id-token: write # necessary to sign the attestations with Sigstore
      attestations: write # necessary to store the attestations on GitHub
    strategy:
      matrix:
        # `image` is the `image` of the `app` matrix above. `subject` is the
        # arch suffix of a pushed image, or `index` for its multi-arch index.
        image: [aldur-nixos, nixos]
        subject: [arm64, amd64, index]
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: subject-${{ matrix.image }}-${{ matrix.subject }}
          path: subject
      - id: subject
        run: echo "digest=$(cat subject/digest)" >> "$GITHUB_OUTPUT"
      - *ghcr-login
      - uses: ./.github/actions/attest
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.subject.outputs.digest }}
          # An index has no SBOM. It only points to the images above.
          sbom-path: ${{ matrix.subject != 'index' && 'subject/sbom.spdx.json' || '' }}
          push-to-registry: true
