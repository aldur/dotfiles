on:
  workflow_dispatch:
  push:
    branches:
      - master
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Publish master to the production `latest` tags; publish any other branch
# (e.g. staging) to `<branch>-*` tags so it can never clobber what `container
# run` consumers pull from `latest`.
env:
  TAG_PREFIX: ${{ github.ref_name == 'master' && 'latest' || github.ref_name }}
  # See the same variable in ci.yml. Only the `push` legs need it: they
  # realise the image, and so evaluate the system config that reads the keys.
  # `manifest` below just stitches already-pushed tags and never touches them.
  SIGNING_KEYS: /tmp/ssh_signing_keys.json

jobs:
  push:
    name: ${{ matrix.app.name }} (${{ matrix.arch.suffix }})
    permissions:
      contents: read
      packages: write # pushes the image to ghcr.io
    strategy:
      matrix:
        arch:
          - { runner: ubuntu-24.04-arm, suffix: arm64 }
          - { runner: ubuntu-24.04, suffix: amd64 }
        app:
          - { name: push, reclaim-disk: true }
          - { name: push-minimal, reclaim-disk: false }
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8

      - if: matrix.app.reclaim-disk
        run: |
          sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /usr/local/julia* \
            /usr/local/lib/android /usr/local/share/chromium /opt/microsoft /opt/google \
            /opt/az /usr/local/share/powershell /opt/hostedtoolcache
          docker system prune -af || true
          docker builder prune -af || true
          df -h

      - run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/fetch-signing-keys.sh

      - run: |
          nix run --override-input aldur-dotfiles . \
            --override-input aldur-dotfiles/gh-signing-keys "file+file://$SIGNING_KEYS" \
            ./base_hosts/apple-container#${{ matrix.app.name }} \
            -- ghcr.io/${{ github.repository_owner }} "$TAG_PREFIX-${{ matrix.arch.suffix }}"

  manifest:
    needs: push
    name: ${{ matrix.app }}
    permissions:
      contents: read
      packages: write # pushes the multi-arch manifest to ghcr.io
    strategy:
      matrix:
        app:
          - manifest
          - manifest-minimal
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8

      # Multi-arch manifest for the branch's tag prefix (`latest` on master).
      - run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: nix run --override-input aldur-dotfiles . ./base_hosts/apple-container#${{ matrix.app }} -- ghcr.io/${{ github.repository_owner }} "$TAG_PREFIX"
