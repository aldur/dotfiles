on:
  workflow_dispatch:
  push:
    branches:
      - master
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Publish the master branch to the production `latest` tags. Publish each
# other branch (for example, staging) to `<branch>-*` tags. Then a branch
# cannot overwrite the `latest` tags that `container run` users pull.
env:
  TAG_PREFIX: ${{ github.ref_name == 'master' && 'latest' || github.ref_name }}
  # See the same variable in ci.yml. Only the `push` jobs use the keys: they
  # build the image, and the build evaluates the system configuration that
  # reads the keys. The `manifest` job below only connects tags that were
  # pushed before, and does not use the keys.
  SIGNING_KEYS: /tmp/ssh_signing_keys.json

jobs:
  push:
    name: ${{ matrix.app.name }} (${{ matrix.arch.suffix }})
    permissions:
      contents: read
      packages: write # necessary to push the image to ghcr.io
    strategy:
      matrix:
        arch:
          - { runner: ubuntu-24.04-arm, suffix: arm64 }
          - { runner: ubuntu-24.04, suffix: amd64 }
        app:
          - { name: push, reclaim-disk: true }
          - { name: push-minimal, reclaim-disk: false }
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &setup-nix
        uses: ./.github/actions/setup-nix

      - if: matrix.app.reclaim-disk
        run: .github/scripts/reclaim-disk.sh

      - &ghcr-login
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/fetch-signing-keys.sh

      - run: |
          nix run --override-input aldur-dotfiles . \
            --override-input aldur-dotfiles/gh-signing-keys "file+file://$SIGNING_KEYS" \
            ./base_hosts/apple-container#${{ matrix.app.name }} \
            -- ghcr.io/${{ github.repository_owner }} "$TAG_PREFIX-${{ matrix.arch.suffix }}"

  manifest:
    needs: push
    name: ${{ matrix.app }}
    permissions:
      contents: read
      packages: write # necessary to push the multi-arch manifest to ghcr.io
    strategy:
      matrix:
        app:
          - manifest
          - manifest-minimal
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *setup-nix

      # Push the multi-arch manifest for the tag prefix of the branch
      # (`latest` on master).
      - *ghcr-login
      - run: nix run --override-input aldur-dotfiles . ./base_hosts/apple-container#${{ matrix.app }} -- ghcr.io/${{ github.repository_owner }} "$TAG_PREFIX"
