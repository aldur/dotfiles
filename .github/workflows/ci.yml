on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - master
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Where `.github/scripts/fetch-signing-keys.sh` leaves the verified keys,
  # and what the jobs that need them override `gh-signing-keys` to.
  SIGNING_KEYS: /tmp/ssh_signing_keys.json

jobs:
  flake-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8
      - uses: DeterminateSystems/flake-checker-action@de924abd783455e8429c858962b9e43062d19da1  # v13
      - run: nix flake check --all-systems --no-build .

  # Build each Linux system's flake checks on a matching runner (flake-check
  # above only evaluates them, see `--no-build`).
  flake-checks-build:
    strategy:
      # Keep going if one arch fails to still warm up the cache.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8
        with:
          trust-runner-user: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: nix-cache
        with:
          path: /tmp/nix-cache
          key: nix-store-${{ matrix.system }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}
          restore-keys: |
            nix-store-${{ matrix.system }}-${{ hashFiles('flake.lock') }}-
      - name: Seed the store from the cache
        run: |
          if [ -f /tmp/nix-cache/roots ]; then
            xargs -r nix copy --no-check-sigs --from file:///tmp/nix-cache \
              < /tmp/nix-cache/roots \
              || echo "::warning::nix cache seed failed; building cold"
          fi
      # Every check relevant to this system.
      - run: |
          nix eval --json .#checks.${{ matrix.system }} --apply builtins.attrNames \
            | jq -r '.[] | ".#checks.${{ matrix.system }}." + .' \
            | xargs -r nix build -L
      # `always()`: Keep what you can even on failure. 
      # Skip it if it was a cache hit.
      - name: Export locally-built paths to the cache
        if: always() && steps.nix-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/nix-cache
          nix path-info --all --json \
            | jq -r 'to_entries[]
                | select((.value.signatures // []) | any(startswith("cache.nixos.org")) | not)
                | select(.value.ca == null or .value.ca == "")
                | select(.key | endswith(".drv") | not)
                | .key' \
            | tee /tmp/nix-cache/roots \
            | xargs -r nix copy --to 'file:///tmp/nix-cache?compression=zstd'
          du -sh /tmp/nix-cache || true

  # One job per (runner, target): the image builds each need tens of GB of
  # scratch space (full-system tarball + 16GiB disk image + copy into the
  # store), so they get a fresh runner instead of sharing one disk.
  nixos-ci:
    strategy:
      fail-fast: false  # indepednent targets
      matrix:
        include:
          # Test building QEMU VM configuration
          - runner: ubuntu-24.04
            target: ./base_hosts/qemu#vm-nogui
          - runner: ubuntu-24.04-arm
            target: ./base_hosts/qemu#vm-nogui

          # Test building the Crostini Baguette image (aarch64-only)
          - runner: ubuntu-24.04-arm
            target: ./base_hosts/crostini#baguette-image

          # Test building the Apple `container` OCI image (serves `container
          # run` and `container machine`; aarch64 is the target).
          - runner: ubuntu-24.04-arm
            target: ./base_hosts/apple-container#container-image
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8

      # Reclaim disk space
      - run: |
          df -h /
          sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /usr/local/julia* \
            /usr/local/lib/android /usr/local/share/chromium /opt/microsoft /opt/google \
            /opt/az /usr/local/share/powershell /opt/hostedtoolcache
          docker system prune -af || true
          docker builder prune -af || true
          df -h /

      - env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/fetch-signing-keys.sh

      - run: |
          nix build --override-input aldur-dotfiles . \
            --override-input aldur-dotfiles/gh-signing-keys "file+file://$SIGNING_KEYS" \
            ${{ matrix.target }}

  nix-darwin-ci:
    runs-on: macos-26  # arm, beta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8

      # `nix flake check --all-systems` (in the flake-check job) already
      # evaluates every system's outputs including darwin — evaluation is
      # host-independent and doesn't build packages — so re-running it on this
      # expensive macOS runner is pure duplication. Just build the darwin bits.

      - env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/fetch-signing-keys.sh

      # Test building nix-darwin configuration
      - run: |
          nix build --override-input aldur-dotfiles . \
            --override-input aldur-dotfiles/gh-signing-keys "file+file://$SIGNING_KEYS" \
            ./base_hosts/macos#darwinConfigurations.macOS.system

  nix-darwin-ci-llm:
    runs-on: macos-26  # arm, beta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8

      # flake check runs once in the flake-check job (see nix-darwin-ci); no
      # need to repeat it on this macOS runner.

      # Explicitly build `llm` with `mlx`, which often breaks on Darwin.
      - run: nix build .#llm
