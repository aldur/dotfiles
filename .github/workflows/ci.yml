name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - master
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # `.github/actions/fetch-signing-keys` writes the verified keys to this
  # path. The jobs that use the keys point the `gh-signing-keys` input to it.
  SIGNING_KEYS: /tmp/ssh_signing_keys.json

# The shared steps are YAML anchors (&name). The first use makes the anchor.
# The steps that follow refer to it with an alias (*name). An alias can only
# refer to an anchor that comes before it in the same file. Anchors do not
# work across files. Because of this, the Nix setup is in
# .github/actions/setup-nix, and all workflows use it. The attestation steps
# are in .github/actions/attest for the same reason.
jobs:
  flake-check:
    name: flake-check
    runs-on: ubuntu-24.04
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &setup-nix
        uses: ./.github/actions/setup-nix
      - uses: DeterminateSystems/flake-checker-action@786422608c7bded2bbc9741ad9f91356842bf520  # v14
        with:
          send-statistics: false
      - &fetch-signing-keys
        uses: ./.github/actions/fetch-signing-keys
        with:
          token: ${{ github.token }}
          path: ${{ env.SIGNING_KEYS }}
      # The override stops an unauthenticated eval-time fetch of
      # api.github.com, which hits the shared rate limit.
      - run: |
          nix flake check --all-systems --no-build \
            --override-input gh-signing-keys "file+file://$SIGNING_KEYS" .

  # Build the flake checks of each Linux system on a runner with the same
  # architecture. The flake-check job above only evaluates the checks
  # (`--no-build`).
  flake-checks-build:
    name: flake-checks-build (${{ matrix.runner }}, ${{ matrix.system }}, ${{ matrix.shard }})
    strategy:
      # If one architecture fails, continue with the other to fill the cache.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
            shard: rest
          # The VM tests get their own runner. They share 17 of the 889 paths
          # that a cold runner builds, so the split costs almost no extra
          # build. It also keeps the neovim and Rust builds away from the
          # test driver, which they starved.
          - runner: ubuntu-24.04
            system: x86_64-linux
            shard: vm
          # The arm64 runners have no KVM, so they have no VM test to build.
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            shard: rest
    runs-on: ${{ matrix.runner }}
    steps:
      - *checkout
      # Not *setup-nix: the cache seed step below is only possible with a
      # trusted user.
      - uses: ./.github/actions/setup-nix
        with:
          trust-runner-user: true
      - name: Allow user namespaces for sandbox checks
        # Ubuntu 24.04's AppArmor restriction blocks UID mapping for the
        # Nix-store bwrap used by agent-sandbox. Relax it on these ephemeral
        # Linux test runners so the check can exercise nested sandboxes.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The checks put more than 17 GiB into the store. A cold build uses
      # more space for its work files. The image builds reclaim disk space
      # for the same reason.
      - uses: ./.github/actions/reclaim-disk
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: nix-cache
        with:
          path: /tmp/nix-cache
          key: &nix-cache-key nix-store-${{ matrix.system }}-${{ matrix.shard }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}
          restore-keys: |
            nix-store-${{ matrix.system }}-${{ matrix.shard }}-${{ hashFiles('flake.lock') }}-
      # `--quiet` on the copies: without it, nix writes one log line for
      # each copied path, and that is thousands of lines for each run.
      - name: Seed the store from the cache
        run: |
          if [ -f /tmp/nix-cache/roots ]; then
            xargs -r nix copy --quiet --no-check-sigs --from file:///tmp/nix-cache \
              < /tmp/nix-cache/roots \
              || echo "::warning::nix cache seed failed; building cold"
          fi
      - *fetch-signing-keys
      # A runner with no free memory stops with no Nix error in the log,
      # and the steps after it do not run. The sampler writes the free
      # memory and disk space into the log of this step each 15 seconds,
      # with the processes that use the most memory.
      - run: |
          .github/scripts/sample-resources.sh &
          sampler=$!
          trap 'kill "$sampler"' EXIT
          .github/scripts/build-flake-checks.sh "$NIX_SYSTEM" "$CHECK_SHARD"
        env:
          NIX_SYSTEM: ${{ matrix.system }}
          CHECK_SHARD: ${{ matrix.shard }}
      # `always()`: keep the completed paths, also after a failure.
      # Do not do this step if the cache had a hit.
      - name: Export locally-built paths to the cache
        if: always() && steps.nix-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/nix-cache
          nix path-info --all --json \
            | jq -r 'to_entries[]
                | select((.value.signatures // []) | any(startswith("cache.nixos.org")) | not)
                | select(.value.ca == null or .value.ca == "")
                | select(.key | endswith(".drv") | not)
                | .key' \
            | tee /tmp/nix-cache/roots \
            | xargs -r nix copy --quiet --to 'file:///tmp/nix-cache?compression=zstd'
          du -sh /tmp/nix-cache || true
      # Upload what the step above exported also in case of failure.
      - name: Save the cache
        if: always() && steps.nix-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/nix-cache
          key: *nix-cache-key

  # Exercise the actual standalone activation on Ubuntu, with a fresh account
  # and a real systemd user manager. NixOS VM checks do not cover this path.
  home-manager-ubuntu:
    name: home-manager-ubuntu (${{ matrix.runner }}, ${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - *checkout
      - *setup-nix
      - uses: ./.github/actions/reclaim-disk
      - *fetch-signing-keys
      - name: Build and activate Home Manager on Ubuntu
        run: .github/scripts/test-home-ubuntu.sh "$NIX_SYSTEM"
        env:
          NIX_SYSTEM: ${{ matrix.system }}
      - name: Upload activation and service logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: home-manager-ubuntu-${{ matrix.system }}
          path: ${{ runner.temp }}/home-manager-ci/logs
          if-no-files-found: warn

  # Start from an Ubuntu cloud image with no Nix. This also tests installation,
  # a non-aldur account, the default login shell, and services after reboot.
  home-manager-ubuntu-vm:
    name: home-manager-ubuntu-vm
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - *checkout
      # Host Nix is used only to verify the signing-key input. The guest starts
      # without Nix and installs it through the same bootstrap as users.
      - *setup-nix
      - uses: ./.github/actions/reclaim-disk
      - *fetch-signing-keys
      - name: Install VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage acl
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Install and test from a fresh Ubuntu VM
        run: bash .github/scripts/test-home-ubuntu-vm.sh
      - name: Upload bootstrap and reboot logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: home-manager-ubuntu-bootstrap
          path: ${{ runner.temp }}/dotfiles-ubuntu-bootstrap/logs
          if-no-files-found: warn

  # One job for each (runner, target) pair. Each image build uses tens of
  # gigabytes of temporary space: a full-system tarball, a 16 GiB disk image,
  # and a copy into the store. A new runner for each build prevents a full
  # disk.
  nixos-ci:
    name: nixos-ci (${{ matrix.runner }}, ${{ matrix.target }})
    strategy:
      fail-fast: false  # The targets are independent.
      matrix:
        include:
          # Build the QEMU VM configuration as a test.
          - runner: ubuntu-24.04
            target: ./base_hosts/qemu#vm-nogui
          - runner: ubuntu-24.04-arm
            target: ./base_hosts/qemu#vm-nogui

          # Build the Crostini Baguette image as a test (only aarch64).
          - runner: ubuntu-24.04-arm
            target: ./base_hosts/crostini#baguette-image

          # Boot the x86_64 Crostini Baguette image in crosvm and probe it.
          # The check needs KVM, which only the x86_64 runners have.
          - runner: ubuntu-24.04
            target: ./base_hosts/crostini#checks.x86_64-linux.baguette-boot

          - runner: ubuntu-24.04
            target: ./base_hosts/crostini#checks.x86_64-linux.baguette-verifier

          # Build the Apple `container` OCI image as a test. The image
          # serves `container run` and `container machine`. The test builds
          # the image and checks its closure and size on each architecture.
          - runner: ubuntu-24.04
            target: ./base_hosts/apple-container#checks.x86_64-linux.container-size
          - runner: ubuntu-24.04-arm
            target: ./base_hosts/apple-container#checks.aarch64-linux.container-size
    runs-on: ${{ matrix.runner }}
    steps:
      - *checkout
      - *setup-nix

      - uses: ./.github/actions/reclaim-disk

      - *fetch-signing-keys

      - run: |
          nix build --override-input aldur-dotfiles . \
            --override-input aldur-dotfiles/gh-signing-keys "file+file://$SIGNING_KEYS" \
            "$NIX_TARGET"
        env:
          NIX_TARGET: ${{ matrix.target }}

  nix-darwin-ci:
    name: nix-darwin-ci
    runs-on: macos-26  # arm, beta
    steps:
      - *checkout
      - *setup-nix

      # The flake-check job runs `nix flake check --all-systems`. That
      # command evaluates the outputs of all systems, darwin included.
      # Evaluation is the same on each host and does not build packages. A
      # second run on this macOS runner gives no new data. Only build the
      # darwin outputs here.

      - *fetch-signing-keys

      # Build the nix-darwin configuration as a test.
      - run: |
          nix build --override-input aldur-dotfiles . \
            --override-input aldur-dotfiles/gh-signing-keys "file+file://$SIGNING_KEYS" \
            ./base_hosts/macos#darwinConfigurations.macOS.system

      # Also build the flake checks (lazyvim included) for darwin.
      - run: .github/scripts/build-flake-checks.sh aarch64-darwin rest

  # Build and test llm on every platform exported by packages.<system>.llm.
  llm:
    name: llm (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-26
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - *checkout
      - *setup-nix
      - name: Build and test the on-demand llm package
        run: |
          nix build ".#packages.$NIX_SYSTEM.llm" \
            ".#checks.$NIX_SYSTEM.llm-runtime"
        env:
          NIX_SYSTEM: ${{ matrix.system }}
