name: Set up Nix
description: >-
  Install Determinate Nix and GitHub Actions caching with concise build logs.

inputs:
  log-lines:
    description: Number of build log lines to show when a build fails.
    required: false
    default: "1000"
  print-missing:
    description: Print the initial list of paths to build or download.
    required: false
    default: "false"
  eval-cores:
    description: Number of evaluation threads; empty keeps the installed setting.
    required: false
    default: ""
  trust-runner-user:
    description: >-
      Magic Nix Cache needs a trusted runner user to configure the store.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3.24.1
      env:
        # This variable stops the telemetry of all Determinate tools.
        # https://docs.determinate.systems/guides/telemetry
        DETSYS_IDS_TELEMETRY: disabled
      with:
        # An empty string stops the diagnostic reports of the installer.
        diagnostic-endpoint: ""
        trust-runner-user: ${{ inputs.trust-runner-user }}
        # The post step of the action writes a build timeline chart to the
        # job summary. The chart is long and always expanded. The action has
        # no option to collapse it, so this input removes the full summary.
        # A failed build shows its log in the job log (see log-lines).
        summarize: false
        # Set restricted options in the daemon configuration so they also
        # apply to clients that are not trusted.
        extra-conf: |
          log-lines = ${{ inputs.log-lines }}
          ${{ inputs.eval-cores != '' && format('eval-cores = {0}', inputs.eval-cores) || '' }}
          print-missing = ${{ inputs.print-missing }}
    # Share store paths between jobs and commits.
    - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      with:
        use-gha-cache: true
        use-flakehub: false
        diagnostic-endpoint: ""
