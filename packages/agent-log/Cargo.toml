[package]
name = "agent-log"
version = "0.1.0"
edition = "2021"

# Borrow metadata while skipping large content values; build a full JSON tree
# only for a record that is actually displayed or searched.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2"
sonic-rs = "0.5.10"
simdutf8 = "0.1.5"
aho-corasick = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
